name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: ./.github/workflows/reusable-python-quality.yml

  web:
    uses: ./.github/workflows/reusable-web-quality.yml

  container-smoke:
    needs: [python, web]
    uses: ./.github/workflows/reusable-container-smoke.yml

  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate workflow action pins and route manifest
        run: node scripts/validate_workflows.mjs

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [python, web, container-smoke, workflow-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
          VALIDATION_RESULT: ${{ needs.workflow-validation.result }}
        run: |
          set -euo pipefail
          for result in "$PYTHON_RESULT" "$WEB_RESULT" "$CONTAINER_RESULT" "$VALIDATION_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "CI lane failed or was skipped: $result"
              exit 1
            fi
          done
