name: Reusable Python quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Python API and processor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            packages/processor/pyproject.toml

      - name: Install API and processor dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "apps/api[dev]" -e packages/processor

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check apps/api packages/processor tests
