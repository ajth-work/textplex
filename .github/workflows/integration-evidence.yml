name: Integration evidence

on:
  workflow_dispatch:
    inputs:
      run_hosted:
        description: "Run configured hosted API and deployment probes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-boundaries:
    name: Local integration boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            packages/processor/pyproject.toml

      - name: Install API and processor dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "apps/api[dev]" -e packages/processor

      - name: Verify auth, ownership, Supabase, learner sync, and commerce boundaries
        run: python -m pytest -q tests/api/test_auth.py tests/api/test_learning_sync.py tests/api/test_phase5_ownership.py tests/api/test_phase6_boundaries.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify backup/restore and web contracts
        run: |
          npm run test:maintenance
          node --test tests/maintenance/data-backup.test.mjs
          npm run test:web:contracts

  hosted-boundaries:
    name: Hosted integration boundaries
    if: ${{ inputs.run_hosted }}
    runs-on: ubuntu-latest
    environment: integration
    env:
      TEXTPLEX_HOSTED_API_BASE_URL: ${{ vars.TEXTPLEX_HOSTED_API_BASE_URL }}
      TEXTPLEX_HOSTED_WEB_BASE_URL: ${{ vars.TEXTPLEX_HOSTED_WEB_BASE_URL }}
      TEXTPLEX_HOSTED_AUTH_TOKEN: ${{ secrets.TEXTPLEX_HOSTED_AUTH_TOKEN }}
      TEXTPLEX_HOSTED_AUTH_TOKEN_B: ${{ secrets.TEXTPLEX_HOSTED_AUTH_TOKEN_B }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hosted auth, Supabase, sync, entitlement, and deployment probes
        run: node scripts/check_hosted_boundaries.mjs
